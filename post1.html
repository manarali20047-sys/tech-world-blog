<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title>Post</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="post-header">
  <h1 id="title"></h1>
  <p class="tag">TECH WORLD ARTICLE</p>
</header>

<div class="post-content">

  <img id="image" class="post-img">

  <div id="text"></div>

  <h2>Related Posts</h2>
  <div class="related" id="related"></div>

  <button onclick="history.back()" class="back-btn">⬅ Back</button>

</div>

<script src="script.js"></script>

<script>
let allPosts = [];

fetch("posts.json")
  .then(res => res.json())
  .then(data => {
    allPosts = data;

    let params = new URLSearchParams(window.location.search);
    let id = params.get("id");

    let post = allPosts[id];

    if(post){
      document.getElementById("title").innerText = post.title;
      document.getElementById("image").src = post.image;

      document.getElementById("text").innerHTML =
        post.content.map(p => `<p>${p}</p>`).join("");

      showRelated(post, id);
    }
  });

// Related posts
let relatedContainer = document.getElementById("related");

function showRelated(currentPost, currentId){

    relatedContainer.innerHTML = "";

    allPosts.forEach((post, index) => {

        if(index != currentId && post.category === currentPost.category){

            relatedContainer.innerHTML += `
            <div class="related-card" onclick="openPost(${index})">
                <img src="${post.image}">
                <h4>${post.title}</h4>
            </div>
            `;
        }
    });
}

function openPost(id){
    window.location.href = "post.html?id=" + id;
}
</script>
<button onclick="window.location.href='index.html'" class="back-btn">
  ⬅ Back to Home
</button>
</body>

</html>
